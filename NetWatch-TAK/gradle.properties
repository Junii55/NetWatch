android.useAndroidX=true
org.gradle.jvmargs=-Xms256m -Xmx4096m

# No android.ndkVersion on purpose.
#
# This plugin contains no native code, so it needs no NDK. The third-party
# pipeline refuses to download an NDK at build time and only offers the versions
# it has preinstalled, so declaring one is a build failure waiting to happen for
# no benefit. Leaving it out means the restriction cannot apply.
