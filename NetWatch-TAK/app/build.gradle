buildscript {
    ext.PLUGIN_VERSION = "1.0.2"
    ext.ATAK_VERSION = "5.6.0"

    // atak-gradle-takdev resolves the ATAK SDK from the TPC maven repository.
    //
    // The pipeline's published requirement says "2.+" for plugins targeting
    // ATAK 4.2 and later, but that text predates the 3.x line: the 5.6.0
    // plugintemplate ships 3.+, and this project's predecessor built and signed
    // successfully on the pipeline with 3.+. Keeping it here for that reason.
    // If a submission is ever rejected over the plugin version, change this one
    // line to '2.+' and resubmit ??? nothing else depends on it.
    def takdevVersion = '3.+'

    def getValueFromPropertiesFile = { propFile, key ->
        if (!propFile.isFile() || !propFile.canRead()) return null
        def prop = new Properties()
        def reader = propFile.newReader()
        try { prop.load(reader) } finally { reader.close() }
        return prop.get(key)
    }
    def getProperty = { name, defValue ->
        def prop = project.properties[name] ?:
                getValueFromPropertiesFile(project.rootProject.file('local.properties'), name)
        return (null == prop) ? defValue : prop
    }
    ext.isDevKitEnabled = { -> return getProperty('takrepo.url', null) != null }
    ext.takrepoUrl = getProperty('takrepo.url', 'https://localhost/')
    ext.takrepoUser = getProperty('takrepo.user', 'invalid')
    ext.takrepoPassword = getProperty('takrepo.password', 'invalid')
    ext.takdevPlugin = getProperty('takdev.plugin', "${rootDir}/../../atak-gradle-takdev.jar")

    repositories {
        google()
        mavenCentral()
        mavenLocal()
        maven {
            url = takrepoUrl
            credentials {
                username = takrepoUser
                password = takrepoPassword
            }
        }
    }
    dependencies {
        if (isDevKitEnabled()) {
            classpath "com.atakmap.gradle:atak-gradle-takdev:${takdevVersion}"
        } else {
            classpath files(takdevPlugin)
        }
    }
}

plugins { id("com.android.application") }
apply { plugin("atak-takdev-plugin") }

allprojects {
    repositories {
        google()
        mavenCentral()
        mavenLocal()
    }
}

// 'civ' must stay first and default so that assembleCivRelease ??? the target the
// third-party pipeline invokes ??? exists and is what an unqualified build
// produces.
def supportedFlavors = [[name: 'civ', default: true], [name: 'mil']]

android {
    namespace 'com.atakmap.android.netwatch.plugin'
    compileSdk 34

    // No ndkVersion and no abiFilters: this plugin ships no native libraries.
    // See gradle.properties.

    buildFeatures { buildConfig = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    bundle { storeArchive { enable = false } }
    packaging {
        resources { excludes += ['META-INF/INDEX.LIST'] }
    }
    signingConfigs {
        debug {
            storeFile file("${buildDir}/android_keystore")
            storePassword "tnttnt"
            keyAlias "wintec_mapping"
            keyPassword "tnttnt"
        }
        release {
            storeFile file("${buildDir}/android_keystore")
            storePassword "tnttnt"
            keyAlias "wintec_mapping"
            keyPassword "tnttnt"
        }
    }
    buildTypes {
        debug { debuggable true; matchingFallbacks = ['sdk'] }
        release {
            minifyEnabled true
            proguardFiles 'proguard-gradle.txt', 'proguard-gradle-repackage.txt'
            signingConfig signingConfigs.release
            matchingFallbacks = ['odk']
        }
    }
    flavorDimensions "application"
    productFlavors {
        supportedFlavors.each { flav ->
            "${flav.name}" {
                getIsDefault().set(flav.default)
                dimension "application"
                matchingFallbacks = ['civ']
                manifestPlaceholders = [atakApiVersion:
                        "com.atakmap.app@" + ATAK_VERSION + ".${flav.name.toUpperCase()}"]
            }
        }
        applicationVariants.all { variant ->
            variant.resValue "string", "versionName", variant.versionName
            buildConfigField 'String', 'ATAK_PACKAGE_NAME', '"com.atakmap.app.civ"'
        }
    }
    sourceSets {
        main {
            setProperty("archivesBaseName",
                    "ATAK-Plugin-" + rootProject.name + "-" + PLUGIN_VERSION + "-" + ATAK_VERSION)
            defaultConfig.versionCode = 3
            defaultConfig.versionName = PLUGIN_VERSION + " - [" + ATAK_VERSION + "]"
        }
        debug.setRoot('build-types/debug')
        release.setRoot('build-types/release')
    }
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
    }
    lint { abortOnError false; checkReleaseBuilds false }
}

// Give the obfuscated classes a package of their own so a crash log points at
// this plugin instead of a pile of anonymous 'a.a.a' frames.
//
// The root project is called "NetWatch-TAK" because the pipeline names APKs
// after it, but a hyphen is not legal in a Java package name ??? feeding the raw
// project name to -repackageclasses produces "atakplugin.NetWatch-TAK" and
// proguard rejects it. Strip to word characters.
afterEvaluate {
    def safe = rootProject.name.replaceAll('[^A-Za-z0-9_]', '')
    project.file('proguard-gradle-repackage.txt').text =
            "-repackageclasses atakplugin.${safe}\n"
}

dependencies { }
