# Copy to local.properties and point sdk.dir at your Android SDK to build
# locally. The third-party pipeline supplies its own, so this file is only for
# your own machine and must not be committed with real credentials in it.
sdk.dir=C\:\\Users\\you\\AppData\\Local\\Android\\Sdk

# Optional, and only useful if you hold artifacts.tak.gov credentials. Without
# these the build falls back to the atak-gradle-takdev jar beside the project
# (see takdev.plugin in app/build.gradle).
#takrepo.url=https://artifacts.tak.gov/artifactory/maven
#takrepo.user=
#takrepo.password=
